spring.application.name=brandmaster
# The staging NuKV/Fount datasource is brandmasternukvhost. Deployments may
# override this with BRANDMASTER_NUKV_CACHE_NAME through environment config.
brandmaster.nukv.cache-name=${BRANDMASTER_NUKV_CACHE_NAME:brandmasternukvhost}
brandmaster.gateway.secret=${BRANDMASTER_GATEWAY_SECRET:}
